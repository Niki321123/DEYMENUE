apply plugin: 'com.android.application'

// ===== PODPISYWANIE WYDANIA =====
// Klucz i hasła NIGDY nie trafiają do repozytorium. Gradle czyta je z pliku
// android-app/android/keystore.properties (ignorowanego przez git) albo — gdy tego pliku
// nie ma — ze zmiennych środowiskowych, czego używa GitHub Actions (sekrety -> env).
// Bez kompletu danych build release powstaje NIEPODPISANY, zamiast wywalić się błędem,
// żeby każdy mógł zbudować projekt bez dostępu do klucza.
def kpFile = rootProject.file("keystore.properties")
def kp = new Properties()
if (kpFile.exists()) { kpFile.withInputStream { kp.load(it) } }

def ksPath      = kp['storeFile']     ?: System.getenv('DAYMENU_KEYSTORE')
def ksPassword  = kp['storePassword'] ?: System.getenv('DAYMENU_KEYSTORE_PASSWORD')
def ksAlias     = kp['keyAlias']      ?: System.getenv('DAYMENU_KEY_ALIAS')
def ksAliasPass = kp['keyPassword']   ?: System.getenv('DAYMENU_KEY_PASSWORD')
def podpisGotowy = ksPath && ksPassword && ksAlias && ksAliasPass && file(ksPath).exists()
if (!podpisGotowy) {
    logger.lifecycle("Day Menu: brak danych klucza (keystore.properties / zmienne DAYMENU_*) — release będzie NIEPODPISANY.")
}

android {
    namespace = "pl.user.daymenu"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pl.user.daymenu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 133
        versionName "1.133"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (podpisGotowy) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksAliasPass
            }
        }
    }
    buildTypes {
        release {
            if (podpisGotowy) { signingConfig signingConfigs.release }
            // debuggable jest domyslnie false dla release - zapisane wprost, zeby bylo widac
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // org.json w android.jar to tylko stuby ("Stub!"); prawdziwa implementacja do testów JVM
    // logiki widżetu (WidgetModel/WidgetText/WidgetSpec) — przesłania stuby na classpathie testu.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
