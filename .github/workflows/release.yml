name: Wydanie APK

# Uruchamia się po wypchnięciu tagu w formacie v* (np. v1.0.0).
# Buduje podpisany release APK, liczy sumę SHA256 i publikuje oba pliki w GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      # Capacitor bierze warstwę webową z android-app/www, a projekt :capacitor-android
      # wskazuje na node_modules — bez instalacji zależności Gradle nie znajdzie modułu.
      - name: Zależności Capacitora
        working-directory: android-app
        run: npm ci

      - name: Aktualna wersja aplikacji do www
        run: cp DayMenu.html android-app/www/index.html

      - name: Synchronizacja Capacitora
        working-directory: android-app
        run: npx cap sync android

      # Keystore trzymamy w sekretach jako base64 (plik binarny nie przejdzie inaczej).
      # Odtwarzamy go do pliku poza drzewem repo, żeby nie dało się go przypadkiem dodać do commita.
      - name: Odtworzenie keystore z sekretów
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Brak sekretu KEYSTORE_BASE64 — wydanie musi być podpisane."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/daymenu-release.jks"

      - name: Build podpisanego APK
        working-directory: android-app/android
        env:
          DAYMENU_KEYSTORE: ${{ runner.temp }}/daymenu-release.jks
          DAYMENU_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DAYMENU_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DAYMENU_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Twardy warunek: build BEZ kompletu sekretów wypada jako "-unsigned" i nie wolno
      # go opublikować. Sprawdzamy też, czy do wydania nie wciekła flaga debuggable.
      - name: Weryfikacja artefaktu
        working-directory: android-app/android/app/build/outputs/apk/release
        run: |
          if [ ! -f app-release.apk ]; then
            echo "::error::Brak app-release.apk — APK nie został podpisany."
            ls -la
            exit 1
          fi
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -n1)
          if "$AAPT" dump xmltree app-release.apk --file AndroidManifest.xml | grep -qi debuggable; then
            echo "::error::Manifest wydania zawiera flagę debuggable."
            exit 1
          fi
          "$AAPT" dump badging app-release.apk | grep -E "^package|uses-permission"

      - name: Nazwa pliku i suma SHA256
        id: pliki
        working-directory: android-app/android/app/build/outputs/apk/release
        run: |
          NAZWA="DayMenu-${GITHUB_REF_NAME}.apk"
          mv app-release.apk "$NAZWA"
          sha256sum "$NAZWA" > "$NAZWA.sha256"
          echo "nazwa=$NAZWA" >> "$GITHUB_OUTPUT"
          echo "suma=$(cut -d' ' -f1 < "$NAZWA.sha256")" >> "$GITHUB_OUTPUT"
          cat "$NAZWA.sha256"

      - name: Publikacja wydania
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-app/android/app/build/outputs/apk/release/${{ steps.pliki.outputs.nazwa }}
            android-app/android/app/build/outputs/apk/release/${{ steps.pliki.outputs.nazwa }}.sha256
          body: |
            ## Day Menu ${{ github.ref_name }}

            **Plik:** `${{ steps.pliki.outputs.nazwa }}`

            **SHA256:**
            ```
            ${{ steps.pliki.outputs.suma }}
            ```

            Przed instalacją sprawdź sumę kontrolną pobranego pliku — instrukcja
            znajduje się w [README](https://github.com/Niki321123/DEYMENUE#instalacja-androida).
            Aplikacja wymaga zezwolenia na instalację z nieznanych źródeł.
